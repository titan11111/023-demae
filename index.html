<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120d0a" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23d92c1d%22/><text x=%2232%22 y=%2245%22 text-anchor=%22middle%22 font-size=%2242%22>🥡</text></svg>" />
    <meta name="description" content="爆速で中華料理を届ける3Dタイムアタック配達ゲーム" />
    <title>出前3Dゲーム｜爆速中華</title>
    <script type="module" crossorigin src="./game-assets/index-DEbYNZkg.js"></script>
    <script defer src="./game-assets/collision-fix.js"></script>
    <script defer src="./game-assets/dynamic-sky.js"></script>
    <link rel="stylesheet" crossorigin href="./game-assets/index-BI2CHB-9.css">
    <style>
      /* Mobile clipping guard: keep the game UI inside the visible/safe viewport. */
      html, body, #game-shell {
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-width: 100vw;
        overflow: hidden;
      }

      #game-shell,
      #ui-root,
      .screen,
      .hud {
        max-width: 100vw;
        max-height: 100dvh;
      }

      @media (max-width: 900px), (max-height: 520px) {
        .title-screen {
          padding-top: max(14px, env(safe-area-inset-top));
          padding-right: max(18px, env(safe-area-inset-right));
          padding-bottom: max(14px, env(safe-area-inset-bottom));
          padding-left: max(18px, env(safe-area-inset-left));
          align-items: center;
        }

        .title-copy {
          width: min(72vw, 560px);
          max-height: calc(100dvh - 28px);
        }

        .title-copy h1 {
          margin: 2px 0 7px;
          font-size: clamp(36px, 9.5vh, 72px);
          line-height: .78;
        }

        .title-copy h1 small {
          margin-bottom: 9px;
          font-size: clamp(10px, 2.2vh, 16px);
          letter-spacing: .30em;
        }

        .tagline {
          margin: 8px 0 12px 4px;
          font-size: clamp(11px, 2.4vh, 16px);
        }

        .arcade-button {
          min-width: 0;
          width: min(280px, 60vw);
          padding: 10px 16px;
          font-size: 12px;
        }

        .records {
          gap: 5px;
          margin-top: 12px;
        }

        .records span {
          padding: 5px 8px;
          font-size: 8px;
        }

        .records b {
          font-size: 15px;
        }

        .renderer {
          margin: 5px 0;
          font-size: 7px;
        }

        .controls-card {
          right: max(10px, env(safe-area-inset-right));
          bottom: max(10px, env(safe-area-inset-bottom));
          width: min(180px, 26vw);
          padding: 9px 11px;
          gap: 3px;
          font-size: 9px;
        }

        .controls-card b {
          font-size: 11px;
        }

        .hud-top {
          padding-top: max(6px, env(safe-area-inset-top));
          padding-right: max(10px, env(safe-area-inset-right));
          padding-left: max(10px, env(safe-area-inset-left));
          gap: 5px;
        }

        .hud-top > div {
          padding: 4px 7px;
          border-left-width: 3px;
        }

        .hud-top small {
          font-size: 6px;
          letter-spacing: .10em;
        }

        .hud-top b {
          font-size: clamp(17px, 5vh, 25px);
        }

        .objective {
          top: max(55px, calc(env(safe-area-inset-top) + 50px));
        }

        .objective span {
          font-size: 20px;
        }

        .objective b {
          font-size: 9px;
        }

        .objective em {
          font-size: 15px;
        }

        .minimap-frame {
          left: max(10px, env(safe-area-inset-left));
          bottom: max(10px, env(safe-area-inset-bottom));
          padding: 5px;
          border-width: 2px;
          box-shadow: 3px 3px 0 var(--red);
        }

        .minimap-frame label {
          padding-bottom: 3px;
          font-size: 7px;
        }

        .minimap-frame canvas {
          width: min(19vh, 110px);
          height: min(19vh, 110px);
        }

        .speedometer {
          right: max(10px, env(safe-area-inset-right));
          bottom: max(10px, env(safe-area-inset-bottom));
          width: 118px;
          padding: 6px;
        }

        .speed-ring {
          width: 82px;
          height: 55px;
          border-width: 4px;
        }

        .speed-ring b {
          font-size: 31px;
        }

        .speedometer > label,
        .speed-ring small {
          font-size: 7px;
        }

        .speedometer kbd,
        .control-hint {
          display: none;
        }

        #virtual-controls {
          padding-right: max(8px, env(safe-area-inset-right));
          padding-bottom: max(8px, env(safe-area-inset-bottom));
          padding-left: max(8px, env(safe-area-inset-left));
        }

        .mobile-steer,
        .mobile-actions {
          bottom: max(8px, env(safe-area-inset-bottom));
          gap: 7px;
        }

        .mobile-steer {
          left: max(8px, env(safe-area-inset-left));
        }

        .mobile-actions {
          right: max(8px, env(safe-area-inset-right));
        }

        #virtual-controls button {
          min-width: 54px;
          min-height: 54px;
          font-size: 13px;
        }

        #virtual-controls .gas-button {
          width: 68px;
          height: 68px;
          font-size: 22px;
        }

        .order-ticket {
          width: min(500px, calc(100vw - 28px));
          max-height: calc(100dvh - 20px);
          overflow: auto;
          padding: 0 22px 20px;
          border-width: 5px;
        }

        .order-ticket header {
          margin: 0 -22px 12px;
          padding: 7px 12px;
        }

        .order-ticket header span {
          font-size: 21px;
        }

        .food-icon {
          width: 92px;
          margin-left: 12px;
          padding: 8px;
          font-size: 40px;
        }

        .order-ticket h2 {
          margin-bottom: 10px;
          font-size: clamp(20px, 5.5vh, 30px);
        }

        .order-ticket dl {
          margin-bottom: 12px;
        }

        .order-ticket dl div {
          padding: 5px 0;
        }

        .result-card {
          width: min(560px, calc(100vw - 30px));
          max-height: calc(100dvh - 22px);
          overflow: auto;
          padding: 18px;
          box-shadow: 6px 6px 0 var(--red), 11px 11px 0 var(--yellow);
        }

        .result-card h2 {
          font-size: clamp(34px, 10vh, 58px);
        }

        .result-number {
          margin: 9px 0 4px;
        }

        .result-number b {
          font-size: clamp(42px, 12vh, 64px);
        }

        .total-score b {
          font-size: clamp(28px, 8vh, 38px);
        }

        .result-actions {
          gap: 12px;
          margin-top: 10px;
        }
      }

      @media (orientation: portrait) and (max-width: 700px) {
        #rotate-overlay {
          padding-top: env(safe-area-inset-top);
          padding-right: max(20px, env(safe-area-inset-right));
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: max(20px, env(safe-area-inset-left));
        }
      }
    </style>
    <meta property="og:title" content="出前3Dゲーム｜爆速中華">
    <meta property="og:description" content="スマホ・PCのブラウザで遊べる無料ゲームです。インストール不要！">
    <meta property="og:url" content="https://titan11111.github.io/023-demae/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game-canvas" tabindex="0" aria-label="出前3Dゲーム画面"></canvas>
      <div id="ui-root"></div>
    </main>
    <div id="rotate-overlay" role="status"><b>↻</b><span>端末を横向きにしてください</span><small>PLEASE ROTATE YOUR DEVICE</small></div>
  </body>
</html>
